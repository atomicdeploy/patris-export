name: Build

on:
  workflow_call:
  push:
    branches: [ main, develop ]

permissions:
  contents: read
  actions: read

jobs:
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Resolve deterministic source metadata
      shell: bash
      run: echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    
    - name: Set up Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: '24'
        
    - name: Install dependencies and source pxlib
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git
        bash scripts/build-pxlib-linux.sh "$GITHUB_WORKSPACE/.deps/pxlib-linux"
        echo "CGO_CFLAGS=-I$GITHUB_WORKSPACE/.deps/pxlib-linux/include" >> "$GITHUB_ENV"
        echo "CGO_LDFLAGS=-L$GITHUB_WORKSPACE/.deps/pxlib-linux/lib" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.deps/pxlib-linux/lib" >> "$GITHUB_ENV"
    
    - name: Build Linux artifacts
      shell: bash
      run: bash ./build.sh --target linux --ci --skip-pxlib --no-assets

    - name: Audit and test optional pxlib backends
      shell: bash
      run: |
        set -euo pipefail
        go vet -tags pxlib_cgo ./...
        go test -count=1 -tags pxlib_cgo ./...
        go vet -tags 'pxlib_cgo,pxlib_cgo_static' ./...
        go test -count=1 -tags 'pxlib_cgo,pxlib_cgo_static' ./...

    - name: Reject incomplete optional-backend tags
      shell: bash
      run: |
        set -euo pipefail
        diagnostic="$(mktemp)"
        trap 'rm -f "$diagnostic"' EXIT
        if CGO_ENABLED=0 go test -count=1 -tags pxlib_cgo ./pkg/paradox >"$diagnostic" 2>&1; then
          echo 'pxlib_cgo unexpectedly built with CGO_ENABLED=0.' >&2
          exit 1
        fi
        grep -F 'pxlib_cgo_requires_CGO_ENABLED_1' "$diagnostic"
        : > "$diagnostic"
        if go test -count=1 -tags pxlib_cgo_static ./pkg/paradox >"$diagnostic" 2>&1; then
          echo 'pxlib_cgo_static unexpectedly built without pxlib_cgo.' >&2
          exit 1
        fi
        grep -F 'pxlib_cgo_static_requires_pxlib_cgo' "$diagnostic"

    - name: Collect and smoke-test Linux runtime
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t pxlib_runtime < <(find .deps/pxlib-linux/lib -maxdepth 1 \( -type f -o -type l \) -name 'libpx*.so*' -print | LC_ALL=C sort)
        if ((${#pxlib_runtime[@]} == 0)); then
          echo 'No source-built pxlib runtime libraries were found.' >&2
          exit 1
        fi
        for library in "${pxlib_runtime[@]}"; do
          cp -L "$library" "build/$(basename "$library")"
        done
        LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build:${LD_LIBRARY_PATH:-}" ./build/patris-export-linux-amd64 --version
        LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build:${LD_LIBRARY_PATH:-}" ./build/patris-export-linux-amd64 info testdata/kala.db
      
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: patris-export-linux-amd64
        path: |
          build/patris-export-linux-amd64
          build/libpatris-export.so
          build/libpatris-export.h
          build/libpx*.so*

    - name: Generate Linux build summary
      if: always()
      shell: bash
      env:
        JOB_STATUS: ${{ job.status }}
        GITHUB_TOKEN: ${{ github.token }}
        ARTIFACT_RETENTION_DAYS: ${{ github.retention_days }}
      run: |
        bash .github/scripts/ci-summary.sh build \
          "🐧 Linux Build Summary" \
          "Built the native Linux CLI/server and the loadable shared library with CGO and pxlib support." \
          "patris-export-linux-amd64" \
          "Native Ubuntu executable plus C shared library" \
          build/patris-export-linux-amd64 \
          build/libpatris-export.so \
          build/libpatris-export.h

  build-windows-mingw-cross:
    name: Build for Windows (MinGW cross-compile from Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Resolve deterministic source metadata
      shell: bash
      run: echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    
    - name: Set up Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: '24'
        
    - name: Install cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 mingw-w64-tools gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 cmake git
        
        # Verify MinGW installation
        echo "Checking MinGW installation..."
        x86_64-w64-mingw32-gcc --version
        ls -la /usr/share/mingw-w64/include/ 2>/dev/null || echo "MinGW headers not in standard location"
    
    - name: Build Windows cross artifacts
      shell: bash
      run: bash ./build.sh --target windows-cross --ci --no-assets
    
    - name: Test Windows executable with Wine
      run: |
        # Install Wine to test Windows executable on Linux
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y wine wine64 wine32
        
        # Test the Windows executable can read the test database
        cd build
        echo "Testing Windows executable with kala.db..."
        wine patris-export-windows-amd64.exe info ../testdata/kala.db || {
          echo "ERROR: Windows executable failed to read database!"
          echo "This indicates the build is not working correctly."
          exit 1
        }
        
        # Verify it reports the correct number of records (use sed for portability, avoid grep -P locale issues)
        RECORD_COUNT=$(wine patris-export-windows-amd64.exe info ../testdata/kala.db 2>/dev/null | grep 'Records:' | sed 's/.*Records:[[:space:]]*\([0-9]*\).*/\1/' || echo "0")
        echo "Windows build reports $RECORD_COUNT records"
        if [ "$RECORD_COUNT" -eq "0" ]; then
          echo "ERROR: Windows build reports 0 records - CGO/pxlib not working!"
          exit 1
        elif [ "$RECORD_COUNT" -ne "354" ]; then
          echo "WARNING: Expected 354 records but got $RECORD_COUNT"
          exit 1
        else
          echo "✅ Windows build correctly reports 354 records"
        fi
        
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: patris-export-windows-mingw-cross-amd64
        path: |
          build/patris-export-windows-amd64.exe
          build/patris-export.dll
          build/patris-export.h
          build/*.dll

    - name: Generate Windows cross-build summary
      if: always()
      shell: bash
      env:
        JOB_STATUS: ${{ job.status }}
        GITHUB_TOKEN: ${{ github.token }}
        ARTIFACT_RETENTION_DAYS: ${{ github.retention_days }}
      run: |
        bash .github/scripts/ci-summary.sh build \
          "🪟 Windows Cross-Build Summary" \
          "Cross-compiled the Windows executable and loadable DLL from Ubuntu using MinGW, upstream pxlib, embedded resources, and Wine verification." \
          "patris-export-windows-mingw-cross-amd64" \
          "Ubuntu MinGW cross-compile for Windows amd64" \
          build/patris-export-windows-amd64.exe \
          build/patris-export.dll \
          build/patris-export.h \
          build/*.dll
