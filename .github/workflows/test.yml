name: Test

on:
  workflow_call:
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    
    - name: Set up Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: '24'
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pxlib-dev pxlib1
    
    - name: Install and audit web dependencies
      run: |
        cd web
        npm clean-install
        npm audit --audit-level=high

    - name: Test and build web frontend
      run: |
        cd web
        npm test
        npm run build

    - name: Audit Go pointer usage
      run: go vet ./...

    - name: Verify Linux ILP32 native long decoding
      env:
        CGO_ENABLED: '0'
      run: GOOS=linux GOARCH=386 go test ./pkg/paradox -run '^TestPxLongSignExtendsNativeNegativeValue$' -count=1

    - name: Test remote delivery examples
      run: node --test scripts/examples/patris-delivery-adapter.test.cjs

    - name: Test JavaScript host adapters
      run: |
        npm --prefix integrations/javascript run check
        npm --prefix integrations/javascript test

    - name: Run tests
      shell: bash
      run: |
        set -o pipefail
        go test -v ./... 2>&1 | tee test-results.log

    - name: Generate test summary
      if: always()
      shell: bash
      env:
        JOB_STATUS: ${{ job.status }}
      run: bash .github/scripts/ci-summary.sh test test-results.log
