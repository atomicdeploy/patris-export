name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.0
      
    - name: Set up Go
      uses: actions/setup-go@v6.5.0
      with:
        go-version: '1.24.11'
        cache: false
    
    - name: Set up Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: '24'
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pxlib-dev pxlib1
    
    - name: Build web frontend
      run: |
        cd web
        npm install
        npm run build
        
    - name: Run tests
      shell: bash
      run: |
        set -o pipefail
        go test -v ./... 2>&1 | tee test-results.log

    - name: Generate test summary
      if: always()
      shell: bash
      env:
        JOB_STATUS: ${{ job.status }}
      run: bash .github/scripts/ci-summary.sh test test-results.log
