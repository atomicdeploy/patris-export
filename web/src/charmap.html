<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patris Export - Character Map</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --panel: #111827;
            --panel-soft: #172033;
            --border: rgba(148, 163, 184, 0.28);
            --text: #f8fafc;
            --muted: #a8b3c7;
            --accent: #22d3ee;
            --accent-2: #a78bfa;
            --danger: #fb7185;
            --ok: #34d399;
            --shadow: 0 18px 60px rgba(0, 0, 0, 0.36);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(34, 211, 238, 0.16), transparent 38%),
                linear-gradient(315deg, rgba(167, 139, 250, 0.14), transparent 38%),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 44px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand img {
            width: 46px;
            height: 46px;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.7rem, 2.8vw, 2.6rem);
            letter-spacing: 0;
        }

        .subtitle {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 0.98rem;
        }

        .nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.68);
            color: var(--text);
            padding: 10px 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
        }

        .btn:hover {
            border-color: rgba(34, 211, 238, 0.7);
            background: rgba(34, 211, 238, 0.12);
            transform: translateY(-1px);
        }

        .btn.primary {
            background: linear-gradient(135deg, #0891b2, #7c3aed);
            border-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .panel {
            background: rgba(17, 24, 39, 0.84);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }

        .panel-body { padding: 18px; }

        .section-title {
            margin: 0 0 12px;
            font-size: 1rem;
            color: #e2e8f0;
        }

        .status {
            display: grid;
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: var(--panel-soft);
            border: 1px solid rgba(148, 163, 184, 0.16);
        }

        .stat span:first-child { color: var(--muted); }
        .stat strong { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
        .ok { color: var(--ok); }
        .danger { color: var(--danger); }

        label {
            display: grid;
            gap: 7px;
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        input[type="text"], input[type="search"], textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.82);
            color: var(--text);
            padding: 11px 12px;
            font: 0.95rem ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            outline: none;
        }

        input[type="file"] {
            width: 100%;
            color: var(--muted);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .notice {
            margin: 14px 0 0;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(251, 113, 133, 0.12);
            border: 1px solid rgba(251, 113, 133, 0.28);
            color: #fecdd3;
        }

        .hidden, .notice.hidden { display: none; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding: 14px;
            border-bottom: 1px solid var(--border);
        }

        .toolbar input { max-width: 340px; }

        .table-wrap {
            overflow: auto;
            max-height: calc(100vh - 245px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.13);
            text-align: left;
        }

        th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #101827;
            color: #cbd5e1;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        td {
            color: #e5edf8;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
        }

        .char-cell {
            font-family: "Segoe UI", Tahoma, ui-sans-serif, system-ui, sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            direction: rtl;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 4px 9px;
            background: rgba(34, 211, 238, 0.12);
            color: #67e8f9;
            border: 1px solid rgba(34, 211, 238, 0.28);
            font-size: 0.78rem;
        }

        .issues {
            padding: 14px 18px 0;
            color: #fde68a;
            font-size: 0.9rem;
        }

        .empty {
            padding: 32px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 860px) {
            .topbar { align-items: flex-start; flex-direction: column; }
            .nav { justify-content: flex-start; }
            .grid { grid-template-columns: 1fr; }
            .table-wrap { max-height: none; }
            .toolbar { align-items: stretch; flex-direction: column; }
            .toolbar input { max-width: none; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <img src="/static/patris-api-icon.png" alt="">
                <div>
                    <h1>Character Map Viewer</h1>
                    <p class="subtitle">Inspect Patris81 legacy bytes, mapped characters, and custom charmap previews.</p>
                </div>
            </div>
            <nav class="nav">
                <a class="btn" href="/">Home</a>
                <a class="btn" href="/viewer">Viewer</a>
            </nav>
        </header>

        <section class="grid">
            <aside class="panel">
                <div class="panel-body">
                    <h2 class="section-title">Map Source</h2>
                    <div class="status">
                        <div class="stat"><span>Source</span><strong id="sourceName">Loading</strong></div>
                        <div class="stat"><span>Entries</span><strong id="entryCount">0</strong></div>
                        <div class="stat"><span>Debug mode</span><strong id="debugState">Checking</strong></div>
                    </div>

                    <div class="actions">
                        <button class="btn primary" id="loadActive">Active map</button>
                        <button class="btn" id="loadDefault">Default map</button>
                    </div>

                    <h2 class="section-title" style="margin-top:22px">Custom Preview</h2>
                    <label>Upload `.txt`
                        <input id="fileInput" type="file" accept=".txt,text/plain">
                    </label>
                    <label>Paste map content
                        <textarea id="mapContent" spellcheck="false" placeholder="9f&#9;ئ"></textarea>
                    </label>
                    <label>Server file path
                        <input id="mapPath" type="text" placeholder="C:\Path\to\farsi_chars.txt">
                    </label>
                    <div class="actions">
                        <button class="btn primary" id="previewContent">Preview content</button>
                        <button class="btn" id="previewPath">Preview path</button>
                    </div>
                    <p class="notice hidden" id="debugNotice"></p>
                </div>
            </aside>

            <section class="panel">
                <div class="toolbar">
                    <div>
                        <span class="badge" id="tableCaption">Embedded map</span>
                    </div>
                    <input id="filterInput" type="search" placeholder="Filter hex, decimal, character, or codepoint">
                </div>
                <div class="issues hidden" id="issues"></div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Hex</th>
                                <th>Decimal</th>
                                <th>Character</th>
                                <th>Codepoint</th>
                                <th>Preview</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="5" class="empty">Loading character map...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <script>
        const state = { entries: [], debugEnabled: false, source: '' };
        const els = {
            sourceName: document.getElementById('sourceName'),
            entryCount: document.getElementById('entryCount'),
            debugState: document.getElementById('debugState'),
            tableBody: document.getElementById('tableBody'),
            tableCaption: document.getElementById('tableCaption'),
            filterInput: document.getElementById('filterInput'),
            fileInput: document.getElementById('fileInput'),
            mapContent: document.getElementById('mapContent'),
            mapPath: document.getElementById('mapPath'),
            debugNotice: document.getElementById('debugNotice'),
            issues: document.getElementById('issues'),
            loadActive: document.getElementById('loadActive'),
            loadDefault: document.getElementById('loadDefault'),
            previewContent: document.getElementById('previewContent'),
            previewPath: document.getElementById('previewPath')
        };

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        async function fetchJSON(url, options) {
            const response = await fetch(url, options);
            if (!response.ok) {
                throw new Error(await response.text() || `${response.status} ${response.statusText}`);
            }
            return response.json();
        }

        function applyPayload(payload) {
            state.entries = payload.entries || [];
            state.debugEnabled = !!payload.debug_enabled;
            state.source = payload.path || payload.source || 'map';
            els.sourceName.textContent = payload.path ? payload.path.split(/[\\/]/).pop() : payload.source;
            els.entryCount.textContent = String(payload.count || state.entries.length);
            els.debugState.textContent = state.debugEnabled ? 'enabled' : 'disabled';
            els.debugState.className = state.debugEnabled ? 'ok' : 'danger';
            els.tableCaption.textContent = payload.path || payload.source || 'Character map';
            if (payload.issues?.length) {
                const sample = payload.issues.slice(0, 5).map(issue => `line ${issue.line}: ${issue.reason}`).join(' · ');
                els.issues.textContent = `${payload.issues.length} ignored line(s): ${sample}`;
                els.issues.classList.remove('hidden');
            } else {
                els.issues.textContent = '';
                els.issues.classList.add('hidden');
            }
            renderTable();
        }

        function renderTable() {
            const filter = els.filterInput.value.trim().toLowerCase();
            const entries = state.entries.filter(entry => {
                if (!filter) return true;
                return [entry.hex, entry.decimal, entry.character, ...(entry.codepoints || [])]
                    .join(' ')
                    .toLowerCase()
                    .includes(filter);
            });
            if (!entries.length) {
                els.tableBody.innerHTML = '<tr><td colspan="5" class="empty">No entries match the current filter.</td></tr>';
                return;
            }
            els.tableBody.innerHTML = entries.map(entry => {
                const char = entry.character || '';
                const codepoints = (entry.codepoints || []).join(' ');
                return `<tr>
                    <td>0x${escapeHtml(entry.hex)}</td>
                    <td>${escapeHtml(entry.decimal)}</td>
                    <td class="char-cell">${escapeHtml(char)}</td>
                    <td>${escapeHtml(codepoints)}</td>
                    <td>${escapeHtml(char === '[zwnj]' ? 'zero-width non-joiner marker' : char)}</td>
                </tr>`;
            }).join('');
        }

        function showNotice(message) {
            els.debugNotice.textContent = message;
            els.debugNotice.classList.toggle('hidden', !message);
        }

        async function loadMap(source = 'active') {
            showNotice('');
            applyPayload(await fetchJSON(`/api/charmap?source=${encodeURIComponent(source)}`));
        }

        async function previewContent() {
            showNotice('');
            const content = els.mapContent.value;
            if (!content.trim()) {
                showNotice('Paste map content or upload a .txt file first.');
                return;
            }
            try {
                applyPayload(await fetchJSON('/api/charmap/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                }));
            } catch (error) {
                showNotice(error.message.trim());
            }
        }

        async function previewPath() {
            showNotice('');
            const path = els.mapPath.value.trim();
            if (!path) {
                showNotice('Enter a server-side file path first.');
                return;
            }
            try {
                applyPayload(await fetchJSON('/api/charmap/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                }));
            } catch (error) {
                showNotice(error.message.trim());
            }
        }

        els.loadActive.addEventListener('click', () => loadMap('active').catch(error => showNotice(error.message)));
        els.loadDefault.addEventListener('click', () => loadMap('default').catch(error => showNotice(error.message)));
        els.previewContent.addEventListener('click', previewContent);
        els.previewPath.addEventListener('click', previewPath);
        els.filterInput.addEventListener('input', renderTable);
        els.fileInput.addEventListener('change', async event => {
            const file = event.target.files?.[0];
            if (!file) return;
            els.mapContent.value = await file.text();
            previewContent();
        });

        loadMap('active').catch(error => showNotice(error.message));
    </script>
</body>
</html>
