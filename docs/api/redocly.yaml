extends:
  - recommended

rules:
  no-unresolved-refs: error
  no-ambiguous-paths: error
  no-invalid-media-type-examples: error
  no-invalid-parameter-examples: error
  no-invalid-schema-examples: error
  operation-operationId: error
  operation-summary: error
  operation-description: error
  # Redirect-only compatibility operations are valid and intentionally have
  # no fabricated 2xx response. Repository completeness tests still require
  # every declared response to document its exact body and headers.
  operation-2xx-response: off
  operation-4xx-response: warn
  operation-tag-defined: error
  security-defined: error
  struct: error
  tags-alphabetical: off

apis:
  patris-export@v1:
    root: ./openapi.yaml
