  securitySchemes:
    edgeBearer:
      bearerFormat: opaque
      description: Edge token as a bearer value; required only when a token is configured.
      scheme: bearer
      type: http
    edgeTokenHeader:
      description: Edge token in the dedicated header; required only when a token is configured.
      in: header
      name: X-Patris-Edge-Token
      type: apiKey
    excelCsrfToken:
      description: Short-lived 43-character loopback session token.
      in: header
      name: X-Patris-Excel-CSRF-Token
      type: apiKey
    recentSalesBearer:
      bearerFormat: opaque
      description: Dedicated recent-sales value read from the configured environment-variable name.
      scheme: bearer
      type: http
    sqlCsrfToken:
      description: CSRF value returned alongside the SQL operator cookie.
      in: header
      name: X-Patris-CSRF-Token
      type: apiKey
    sqlOperatorToken:
      description: Dedicated 32–512 character bootstrap token for protected/non-loopback SQL operator sessions.
      in: header
      name: X-Patris-SQL-Operator-Token
      type: apiKey
    sqlSessionCookie:
      description: HttpOnly, origin-bound SQL operator session cookie.
      in: cookie
      name: patris_sql_operator_session
      type: apiKey
externalDocs:
  description: Patris Export repository and narrative integration guides
  url: https://github.com/atomicdeploy/patris-export
info:
  contact:
    name: AtomicDeploy
    url: https://github.com/atomicdeploy/patris-export
  description: |
    This document describes the HTTP surface registered by Patris Export's
    `server.setupRoutes`. It is intentionally honest about the current security
    boundary: most viewer and diagnostic routes do not authenticate callers and
    are safe only while the service remains bound to a trusted loopback or
    otherwise protected network.

    A missing security requirement means that the implementation performs no
    authentication for that operation. `x-visibility` classifies the intended
    audience; it does not add enforcement. Protected operations document the
    exact handler-local bearer, loopback, cookie, CSRF, or operator checks.

    JSON product records are source-dependent. Canonical product contracts are
    sparse: absent upstream values are omitted, while an explicitly supplied
    upstream null remains JSON null.
  license:
    identifier: MIT
    name: MIT
  summary: Complete HTTP contract for the built-in viewer and external integrations
  title: Patris Export HTTP API
  version: 1.3.1
openapi: 3.1.1
paths:
  /:
    get:
      description: Serves the embedded welcome HTML without consulting the datasource.
      operationId: getWelcomePage
      responses:
        "200":
          content:
            text/html:
              example: <!doctype html><html lang="en"><title>Patris Export</title>...</html>
              schema:
                type: string
          description: Embedded welcome page.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoCache"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
      security: []
      summary: Open the welcome page
      tags:
        - User interface
      x-code-anchors:
        - pkg/server/server.go#Server.handleWelcome
      x-errors-not-applicable: true
      x-internal: false
