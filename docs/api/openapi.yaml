            - string
            - "null"
        foreign_price:
          type:
            - number
            - "null"
        irt_per_cny:
          type:
            - number
            - "null"
        location:
          type:
            - string
            - "null"
        markup_percent:
          type:
            - number
            - "null"
        minimum_stock:
          type:
            - number
            - "null"
        name:
          type:
            - string
            - "null"
        partner_price_source:
          type:
            - number
            - "null"
        price_rounding_digits:
          type:
            - integer
            - "null"
        price_rounding_mode:
          type: string
        price_source_amount:
          type: number
        price_source_currency:
          type: string
        price_source_kind:
          enum:
            - foreign_price
            - partner_price
            - sale_price_direct
          type: string
        pricing_catalog_revision:
          type:
            - string
            - "null"
        pricing_catalog_status:
          type:
            - string
            - "null"
        product_code:
          type: string
        purchase_price_source:
          type:
            - number
            - "null"
        record_hash:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        sale_price_source:
          type:
            - number
            - "null"
        serial:
