        event_id:
          minLength: 1
          type: string
        event_type:
          enum:
            - snapshot
            - update
          type: string
        excluded_codes:
          items:
            type: string
          type: array
        formula_id:
          enum:
            - landed_price
            - null
          type:
            - string
            - "null"
        generated_at:
          format: date-time
          type: string
        local_currency:
          enum:
            - IRT
            - null
          type:
            - string
            - "null"
        products:
          items:
            $ref: "#/components/schemas/CanonicalProduct"
          type: array
        quarantined_codes:
          items:
            type: string
          type: array
        schema:
          const: patris.product-sync
        source:
          $ref: "#/components/schemas/CanonicalSource"
        warnings:
          items:
            type: string
          type: array
      required:
