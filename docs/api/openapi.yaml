  /api/edge/upload:
    post:
      description: |
        Streams a `.db` or `.json` multipart file into the configured upload
        directory, optionally verifies size and CRC32, opens and reads it, then
        atomically replaces the active datasource and broadcasts a new snapshot.

        Authentication is configuration-dependent. When no edge token exists,
        the handler currently permits an unauthenticated request; otherwise
        either the bearer or dedicated header must match.
      operationId: uploadEdgeSnapshot
      parameters:
        - description: Source identifier fallback when the multipart field is absent.
          in: header
          name: X-Patris-Source-ID
          required: false
          schema:
            maxLength: 80
            type: string
        - description: Expected decimal byte length fallback.
          in: header
          name: X-Patris-File-Size
          required: false
          schema:
            format: int64
            minimum: 0
            type: integer
        - description: Expected lowercase or uppercase IEEE CRC32 hexadecimal fallback.
          in: header
          name: X-Patris-File-CRC32
          required: false
          schema:
            pattern: ^[0-9A-Fa-f]{8}$
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: application/octet-stream, application/json
            example:
              crc32: 89abcdef
              file: <binary catalog.json payload>
              size: 4096
              source_id: office
            schema:
              $ref: "#/components/schemas/EdgeUploadRequest"
        description: One `.db` or `.json` snapshot plus optional source identifier, expected size, and CRC32.
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                file: catalog.json
                hash: 89abcdef
                message: edge upload accepted
                path: C:/example/edge-uploads/office-catalog-123.json
                records: 25
                size: 4096
                source_id: office
                success: true
              schema:
                $ref: "#/components/schemas/EdgeUploadResponse"
          description: Upload was saved, validated, and activated.
        "400":
          $ref: "#/components/responses/EdgeUploadBadRequest"
        "401":
          $ref: "#/components/responses/EdgeUploadUnauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/EdgeUploadTooLarge"
        "500":
          $ref: "#/components/responses/EdgeUploadInternalError"
      security:
        - {}
        - edgeBearer: []
        - edgeTokenHeader: []
      summary: Upload and activate an edge snapshot
      tags:
        - Private integrations
      x-code-anchors:
        - pkg/server/server.go#Server.handlePostEdgeUpload
      x-internal: false
      x-visibility: protected-ingestion-api
