        config_path:
          type: string
        config_paths:
          items:
            type: string
          type: array
        name:
          const: Patris Export
        resources:
          $ref: "#/components/schemas/ResourceInfo"
        version:
          $ref: "#/components/schemas/VersionInfo"
      required:
        - name
        - version
        - resources
        - config_path
      type: object
    BrowserConfig:
      additionalProperties: false
      description: |
        Versioned application configuration. Subsystems evolve independently,
        so this schema names stable top-level sections and core server/database
        fields while preserving extension fields. Browser responses omit
        protected MySQL fields, `edge.token`, `send_updates.headers`,
        `send_updates.command`, and `extra`, and replace `recent_sales` with an
        empty object. HTTP(S) endpoint fields retain only scheme, host, and path;
        userinfo, query, and fragment components remain server-side. PUT
        preserves those protected values and ignores submitted replacements or
        placeholders. Fields ending in `_env` are environment-variable
        identifiers only; credential values are resolved server-side and never
        enter this configuration payload.
      example:
        canonical:
          enabled: true
          pricing:
            digitalogic:
              assignment_path: integration/products/by-code/{code}/pricing
              base_url: https://integration.example.test/wp-json/digitalogic
              batch_assignment_path: integration/pricing-assignments/batch
              batch_concurrency: 2
              batch_size: 500
              bearer_token_env: DIGITALOGIC_PRICING_READ_TOKEN
              catalog_path: integration/catalog
              fresh_for: 5m
              max_concurrency: 8
              max_entries: 2048
              max_response_bytes: 2097152
              max_stale: 1h
              timeout: 20s
            mode: digitalogic
            static: {}
            use_sale_price_direct_fallback: false
          profiles:
            catalog.db:
              type: kala
          source_id: office-catalog
        column_labels:
          name: Name
          product_code: Code
        convert:
          debounce: 1s
          format: xlsx
          output: C:/example/exports
          raw: false
          watch: false
        database:
          charmap: ""
          direct_access: false
          path: C:/example/catalog.db
          raw: false
          rtl_conversion: false
        edge:
          debounce: 1s
          enabled: false
          max_upload_mb: 512
          source_id: office-catalog
          target_url: https://edge.example.test
          upload_dir: edge-uploads
        export:
          batch_size: 500
          dry_run: false
          mysql_connect_timeout: 10s
          mysql_table: products
          reconciliation: upsert_only
          sqlite_path: C:/example/exports/catalog.sqlite
          sqlite_table: products
          xlsx_language: fa
          xlsx_mode: formula
          xlsx_zebra_rows: true
        notifications:
          client_connected: false
          client_disconnected: false
          enabled: true
          file_updated: true
          in_app: true
          include_row_values: false
          max_rows: 3
          native: true
          row_updated: true
        recent_sales: {}
        runtime:
          debug: false
          temp_dir: system
          temp_memory_limit_mb: 100
          temp_strategy: system
        schema_version: 1
        send_updates:
          allow_raw: false
          enabled: true
          format: json
          initial: true
          method: POST
          mode: changes
          product_sync_secret_env: PATRIS_PRODUCT_SYNC_SECRET
          require_contract: true
          retry_attempts: 3
          retry_backoff: 2s
          timeout: 10s
          url: https://receiver.example.test/wp-json/digitalogic/v1/integration/patris
        server:
          debounce: 500ms
          host: 127.0.0.1
          http: true
          ipc:
            enabled: false
            path: ""
          port: 18080
          watch: true
        transform:
          enabled: true
          fields:
            Code: product_code
            Name: name
          key_field: Code
        ui:
          auto_scroll_to_changed: true
          column_order:
            - product_code
            - name
            - final_price
          column_widths:
            name: 320
            product_code: 160
          enable_pagination: true
          enable_row_coloring: true
          enable_row_icons: true
          freeze_first_column: true
          hidden_columns: []
          highlight_changes: true
          language: fa
          last_update_display_mode: both
          notification_sound_source: external
          page_size: 100
          play_notification_sound: true
          row_color_group: "#6366f1"
          row_color_has_stock: "#10b981"
          row_color_no_stock: "#6b7280"
          row_color_subgroup: "#0ea5e9"
          row_icon_fallback:
            color: "#6366f1"
            icon: info
            label: Product
          row_icon_rules:
            - color: "#d97706"
              field: warnings
              icon: warning
              id: warnings
              label: Warnings
              operator: not_empty
              value: ""
          rtl_text_direction: true
          show_footer: true
          theme: system
      properties:
        canonical:
          $ref: "#/components/schemas/CanonicalConfig"
        column_labels:
          additionalProperties:
            type: string
          type: object
        convert:
          $ref: "#/components/schemas/ConvertConfig"
        database:
          $ref: "#/components/schemas/DatabaseConfig"
        edge:
          $ref: "#/components/schemas/BrowserEdgeConfig"
        export:
          $ref: "#/components/schemas/BrowserExportConfig"
        notifications:
          $ref: "#/components/schemas/NotificationsConfig"
        recent_sales:
          $ref: "#/components/schemas/EmptyProtectedConfig"
        runtime:
          $ref: "#/components/schemas/RuntimeConfig"
        schema_version:
          const: 1
          type: integer
        send_updates:
          $ref: "#/components/schemas/BrowserSendUpdatesConfig"
        server:
          $ref: "#/components/schemas/ServerConfig"
        transform:
          $ref: "#/components/schemas/TransformConfig"
        ui:
          $ref: "#/components/schemas/UIConfig"
      required:
        - schema_version
        - server
        - database
        - runtime
        - convert
        - transform
        - canonical
        - recent_sales
        - export
        - send_updates
        - edge
        - notifications
        - ui
        - column_labels
      type: object
    BrowserEdgeConfig:
      additionalProperties: false
      description: Browser-visible edge settings. The protected `token` is deliberately absent and remains server-side. URL userinfo, query, and fragment components are stripped from `target_url`.
      properties:
        debounce:
          type: string
        enabled:
          type: boolean
        max_upload_mb:
          format: int64
          minimum: 1
          type: integer
        source_id:
          type: string
        target_url:
          description: Credential-free browser projection containing only the configured HTTP(S) scheme, host, and path.
          type: string
        upload_dir:
          type: string
      required:
        - enabled
        - target_url
        - source_id
        - debounce
        - max_upload_mb
        - upload_dir
      type: object
    BrowserExportConfig:
      additionalProperties: false
      description: |
        Browser-visible export settings. `mysql_dsn`, `mysql_tls_ca_file`, and
        `mysql_tls_server_name` are deliberately absent and remain server-side.
      properties:
        batch_size:
          minimum: 1
          type: integer
        dry_run:
          type: boolean
        mysql_connect_timeout:
          type: string
        mysql_table:
          type: string
        reconciliation:
          enum:
            - upsert_only
            - soft_delete_missing
            - delete_missing
          type: string
        sqlite_path:
          type: string
        sqlite_table:
          type: string
        xlsx_language:
          enum:
            - auto
            - fa
            - en
          type: string
        xlsx_mode:
          enum:
            - precalculated
            - formula
          type: string
        xlsx_zebra_rows:
          type: boolean
      required:
        - xlsx_zebra_rows
      type: object
    BrowserSendUpdatesConfig:
      additionalProperties: false
      description: Browser-visible outbound settings. The protected `headers` map and complete `command` array are deliberately absent and remain server-side. URL userinfo, query, and fragment components are stripped.
      properties:
        allow_raw:
          type: boolean
        enabled:
          type: boolean
        format:
          type: string
        initial:
          type: boolean
        method:
          type: string
        mode:
          type: string
        product_sync_secret_env:
          description: Environment-variable identifier; the secret value is resolved only by the server.
          type: string
        require_contract:
          type: boolean
        retry_attempts:
          maximum: 10
          minimum: 1
          type: integer
        retry_backoff:
          type: string
        timeout:
          type: string
        url:
          description: Credential-free browser projection containing only the configured HTTP(S) scheme, host, and path.
          format: uri
          type: string
      required:
        - enabled
        - initial
      type: object
    CanonicalConfig:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        pricing:
          $ref: "#/components/schemas/PricingCatalogConfig"
